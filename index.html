const sceneTitles = {"1": "S1 망설임 (카페 앞)", "2": "S2 머릿속 알람", "3": "S3 난리법석", "4": "S4 결단 + 답변", "5": "S5 대면 고백", "6": "S6 위로 + 마무리"};
const cutDescs = {"1-1": "카페 외경", "1-2": "학생 미디엄", "1-3": "카페 안 여자 OTS", "1-4": "학생 close", "1-5": "학생 호흡", "1-6": "머릿속 호출", "2-1": "빈 화이트 룸", "2-2": "알람 돔", "2-3": "천장 카드", "2-4": "문학 솔로", "2-5": "심리 솔로", "2-6": "역사 솔로", "3-1": "문학 책 던지기", "3-2": "역사 보드", "3-3": "심리 차트", "3-4": "역사vs문학 다툼", "3-5": "심리 폭발", "3-6": "셋 탈진", "4-1": "정적", "4-2": "심리 결단", "4-3": "종이 글", "4-4": "종이 위로", "4-5": "(legacy)", "4-6": "(legacy)", "5-1": "카페 들어감", "5-2": "걸어감", "5-3": "앉음", "5-4": "고백 말함", "5-5": "여자 거절", "5-6": "학생 충격", "6-1": "카드 떨어짐", "6-2": "셋 벙찜", "6-3": "솔로 충격", "6-4": "AI 자동", "6-5": "폰 위로", "6-6": "어이없는 미소"};
const cutIds = Object.keys(data).sort();

let selected = JSON.parse(localStorage.getItem('selected_compare') || '[]');

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function selKey(cutId, ver){return cutId + '__' + ver}

function render(){
  const g = document.getElementById('gallery');
  g.innerHTML = '';
  const sceneGroups = {};
  cutIds.forEach(cutId => {
    const scene = cutId.split('-')[0];
    sceneGroups[scene] = sceneGroups[scene] || [];
    sceneGroups[scene].push(cutId);
  });
  Object.keys(sceneGroups).sort().forEach(scene => {
    const sceneEl = document.createElement('div');
    sceneEl.className = 'scene';
    const t = document.createElement('div');
    t.className = 'scene-title';
    t.textContent = sceneTitles[scene] || ('S' + scene);
    sceneEl.appendChild(t);
    sceneGroups[scene].forEach(cutId => {
      const row = document.createElement('div');
      row.className = 'cut-row';
      const header = document.createElement('div');
      header.className = 'cut-header';
      header.innerHTML = '<span class="cut-id">cut_' + cutId + '</span><span class="cut-desc">' + (cutDescs[cutId]||'') + '</span><span style="color:#666;font-size:11px;">(' + data[cutId].length + ' versions)</span>';
      row.appendChild(header);
      const versions = document.createElement('div');
      versions.className = 'versions';
      data[cutId].forEach(v => {
        const key = selKey(cutId, v.ver);
        const card = document.createElement('div');
        card.className = 'card' + (selected.includes(key) ? ' selected' : '');
        card.onclick = () => toggle(key);
        card.innerHTML = '<img loading="lazy" src="images/' + v.file + '" alt="' + key + '"><div class="ver-label">' + v.ver + '</div><div class="check"></div>';
        versions.appendChild(card);
      });
      row.appendChild(versions);
      sceneEl.appendChild(row);
    });
    g.appendChild(sceneEl);
  });
  updateCount();
  updateOutput();
}

function toggle(key){
  if (selected.includes(key)) selected = selected.filter(x => x !== key);
  else selected.push(key);
  localStorage.setItem('selected_compare', JSON.stringify(selected));
  render();
}

function updateCount(){
  document.getElementById('count').textContent = selected.length + '개 선택';
}

function updateOutput(){
  if (!selected.length) {document.getElementById('output').textContent = '아직 선택 없음'; return;}
  const byCut = {};
  [...selected].sort().forEach(s => {
    const [cut, ver] = s.split('__');
    byCut[cut] = byCut[cut] || [];
    byCut[cut].push(ver);
  });
  let lines = ['선택된 베스트컷 (' + selected.length + '장):'];
  Object.keys(byCut).sort().forEach(cut => {
    lines.push('  cut_' + cut + ': ' + byCut[cut].join(', '));
  });
  document.getElementById('output').textContent = lines.join('\n');
}

function copySelection(){
  if (!selected.length) {showToast('선택 없음'); return;}
  const byCut = {};
  [...selected].sort().forEach(s => {
    const [cut, ver] = s.split('__');
    byCut[cut] = byCut[cut] || [];
    byCut[cut].push(ver);
  });
  const text = Object.keys(byCut).sort().map(c => 'cut_' + c + ' = ' + byCut[c].join('+')).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('복사됨 ' + selected.length + '장'));
}

function clearSelection(){
  if (confirm('정말 초기화?')) {selected = []; localStorage.setItem('selected_compare','[]'); render();}
}

render();
</script></body></html>
